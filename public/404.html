<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Memoirs of a Wanderer</title>
<style>
  :root { --paper:#d9d4c7; --ink:#141414; --red:#e2312a; --blue:#2b4bd6; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--paper); color:var(--ink); font-family:"Courier New", Courier, monospace; padding:24px; }
  main { max-width:560px; text-align:left; }
  .kicker { display:inline-block; background:var(--ink); color:var(--paper); padding:4px 10px;
            font-size:12px; letter-spacing:.2em; text-transform:uppercase; }
  h1 { font-family:Impact, "Arial Narrow Bold", sans-serif; font-size:clamp(64px,18vw,140px);
       line-height:.9; margin:18px 0 10px; letter-spacing:-.02em; }
  h1 span { background:var(--red); color:var(--paper); padding:0 .08em; }
  p { font-size:16px; line-height:1.6; }
  a.btn { display:inline-block; margin-top:12px; background:var(--red); color:#fff; text-decoration:none;
          padding:10px 16px; font-size:13px; letter-spacing:.15em; text-transform:uppercase; }
  a.btn:hover { background:var(--ink); }
  .alt { color:var(--blue); }
</style>
</head>
<body>
<main>
  <span class="kicker">The Cutting Room</span>
  <h1>4<span>0</span>4</h1>
  <p>This page wandered off the reel. It may have been moved, renamed, or never made the final cut.</p>
  <a class="btn" href="/">&larr; Back to the homepage</a>
</main>
</body>
</html>
